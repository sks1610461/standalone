grafana:
  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
  resources:
    requests:
      cpu: "0.6"
      memory: 700Mi
    limits:
      cpu: "0.8"
      memory: 800Mi
  persistence:
    enabled: false
    type: sts
    accessModes:
      - ReadWriteOnce
    size: 4Gi
    finalizers:
      - kubernetes.io/pvc-protection

  envValueFrom:
    GF_REMOTE_CACHE_CONNSTR:
      secretKeyRef:
        name: grafana-cache-secret
        key: GF_REMOTE_CACHE_CONNSTR
    VALKEY_PASSWORD:
      secretKeyRef:
        name: valkey-secret
        key: valkey-password
    GF_DATABASE_PASSWORD:          # ← ADD THIS
      secretKeyRef:
        name: postgresql-grafana-secret
        key: POSTGRES_PASSWORD

  env:
    GF_REMOTE_CACHE_TYPE: "redis"

  grafana.ini:
    server:
      domain: ""
    database:                      # ← ADD THIS SECTION
      type: postgres
      host: postgresql.monitoring.svc.cluster.local:5432
      name: grafana
      user: postgres
      password: "${GF_DATABASE_PASSWORD}"
      ssl_mode: disable
      max_open_conn: 100
      max_idle_conn: 25
      conn_max_lifetime: 14400
